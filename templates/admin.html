<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>使用紀錄 — NenAI Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400&family=Noto+Serif+TC:wght@400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* 版面由官網 session 設計（2026-09-09），token 對齊官網 assets/site.css。
   2026-09-09 二修（Levi）：最多 30 天；呼叫紀錄精簡成時間／使用者／模型／狀態，
   來源 IP 改成需要時才查（那是載入最慢的一段）；使用者佔比改用圓環圖。
   圓環的配色刻意只用天青一個色相、以明度分階——設計規範只允許一個彩度。 */
:root {
  --ground:#FBFAF8; --ink:#2B2724; --body:#5C564F; --rain:#787168; --line:#E6E2DB;
  --flash:#7FA39E; --flash-ink:#3F625F; --ember:#8C4A3F; --ground-2:#F6F2E9; --r:10px;
  --display:'Spectral','Noto Serif TC',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --ground:#191715; --ink:#EDEAE4; --rain:#8F8880; --body:#B8B1A8;
          --line:#302C28; --flash:#9CC0BA; --flash-ink:#A9CCC6; --ember:#E8B9AC; --ground-2:#1E1B18; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--body);
  font:400 15px/1.65 -apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(1rem,4vw,2.5rem) 4rem}
a{color:var(--flash-ink)}

/* 標頭 */
.op-head{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;
  padding-block:1.5rem;border-bottom:1px solid var(--line)}
.op-head h1{margin:0;font-family:var(--display);font-weight:400;font-size:1.5rem;letter-spacing:-.008em;color:var(--ink)}
.op-head .who{margin-left:auto;font-family:var(--mono);font-size:.75rem;color:var(--rain);display:flex;gap:.9rem;align-items:baseline}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg a{padding:.3rem .7rem;font-family:var(--mono);font-size:.75rem;text-decoration:none;color:var(--body);border-right:1px solid var(--line)}
.seg a:last-child{border-right:0}
.seg a.on{background:var(--flash);color:var(--ground)}
.seg a:not(.on):hover{background:var(--ground-2)}

/* 摘要條 */
.op-strip{padding-block:1.75rem 1.25rem}
.op-strip .n{display:block;font-family:var(--display);font-weight:400;color:var(--ink);
  font-size:clamp(2rem,4vw,3rem);line-height:1.1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.op-strip .n small{font-family:var(--mono);font-size:.8125rem;color:var(--rain);letter-spacing:.04em;margin-left:.5rem}
.op-strip .sub{margin-top:.35rem;font-family:var(--mono);font-size:.8125rem;letter-spacing:.02em;color:var(--rain)}
.op-strip .sub b{color:var(--body);font-weight:400;font-variant-numeric:tabular-nums}

h2{margin:2.25rem 0 .9rem;font-family:var(--display);font-weight:400;font-size:1rem;color:var(--ink)}
h2 .hint{font-family:var(--mono);font-size:.6875rem;letter-spacing:.04em;color:var(--rain);margin-left:.6rem}

/* 每日直條圖：柱子可點，點了就把下方查詢的時間設成那一天 */
.op-chart{width:100%;height:110px;overflow:visible;display:block}
.op-chart rect{fill:var(--flash);cursor:pointer}
.op-chart rect:hover{fill:var(--flash-ink)}
.op-chart rect.sel{fill:var(--flash-ink)}
.op-chart .axis-label{font-family:var(--mono);font-size:.625rem;fill:var(--rain)}

/* 使用者佔比：圓環＋圖例，兩邊都可點來篩選 */
.op-cols{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem}
@media (max-width:760px){.op-cols{grid-template-columns:1fr;gap:1.5rem}}
.op-pie{display:grid;grid-template-columns:auto 1fr;gap:1.25rem;align-items:center}
@media (max-width:420px){.op-pie{grid-template-columns:1fr}}
.op-pie svg{width:150px;height:150px;overflow:visible}
.op-pie path{cursor:pointer;transition:opacity .12s}
.op-pie path:hover{opacity:.75}
.op-pie .mid{font-family:var(--mono);font-size:11px;fill:var(--rain);text-anchor:middle}
.op-pie .mid .big{font-family:var(--display);font-size:20px;fill:var(--ink)}
.op-legend{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.op-legend .row{display:grid;grid-template-columns:10px 1fr auto auto;gap:.5rem;align-items:baseline;
  cursor:pointer;border-radius:6px;padding:.12rem .3rem;margin-inline:-.3rem}
.op-legend .row:hover,.op-legend .row.sel{background:var(--ground-2)}
.op-legend .dot{width:10px;height:10px;border-radius:2px;align-self:center}
.op-legend .nm{font-size:.8125rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op-legend .pc{font-family:var(--mono);font-size:.75rem;color:var(--ink);font-variant-numeric:tabular-nums}
.op-legend .ct{font-family:var(--mono);font-size:.6875rem;color:var(--rain);font-variant-numeric:tabular-nums}

/* 各模型：雙色細條，整列可點來篩選 */
.op-bar-list{display:flex;flex-direction:column;gap:.6rem}
.op-bar-row{display:grid;grid-template-columns:1fr auto;gap:.15rem .75rem;align-items:baseline;
  cursor:pointer;border-radius:6px;padding:.15rem .35rem;margin-inline:-.35rem}
.op-bar-row:hover,.op-bar-row.sel{background:var(--ground-2)}
.op-bar-row .name{font-size:.875rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op-bar-row .count{font-family:var(--mono);font-size:.8125rem;color:var(--rain);
  font-variant-numeric:tabular-nums;text-align:end}
.op-bar-track{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:flex}
.op-bar-track .fill-bar{display:flex;min-width:2px}
.op-bar-track .fill-ok{background:var(--flash)}
.op-bar-track .fill-err{background:var(--ember)}
.op-bar-row .fail{grid-column:1/-1;font-family:var(--mono);font-size:.6875rem;color:var(--ember);letter-spacing:.02em}

/* 查詢條 */
.op-filter{display:flex;flex-wrap:wrap;gap:.6rem .8rem;align-items:end;margin-bottom:.9rem}
.op-filter label{display:flex;flex-direction:column;gap:.25rem;
  font-family:var(--mono);font-size:.6875rem;letter-spacing:.04em;color:var(--rain)}
.op-filter input,.op-filter select{font-family:var(--mono);font-size:.8125rem;color:var(--ink);
  background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:.35rem .5rem;min-height:32px}
.op-filter input:focus,.op-filter select:focus{outline:none;border-color:var(--flash)}
.op-filter .grow{flex:1;min-width:150px}
.op-filter .grow input{width:100%}
.op-filter button{font-family:var(--mono);font-size:.75rem;color:var(--body);cursor:pointer;
  background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:.42rem .8rem}
.op-filter button:hover{border-color:var(--flash);color:var(--flash-ink)}
.op-filter .chk{flex-direction:row;align-items:center;gap:.4rem;cursor:pointer;padding-bottom:.45rem}
.op-filter .chk input{min-height:0;accent-color:var(--flash)}

/* 呼叫紀錄 */
.op-recent{background:var(--ground-2);border-radius:var(--r);padding:1.25rem clamp(1rem,3vw,1.75rem)}
.op-recent .scroll-wrap{overflow-x:auto}
.op-recent table{width:100%;border-collapse:collapse;font-size:.8125rem}
.op-recent thead th{font-family:var(--mono);font-size:.6875rem;letter-spacing:.06em;color:var(--rain);
  text-align:left;font-weight:400;padding-bottom:.5rem;padding-right:1.25rem;
  border-bottom:1px solid var(--line);white-space:nowrap}
.op-recent td{padding-block:.55rem;padding-right:1.25rem;border-bottom:1px solid var(--line);
  font-family:var(--mono);color:var(--body);white-space:nowrap}
.op-recent th:last-child,.op-recent td:last-child{padding-right:0}
.op-recent td.empty::before{content:"–";color:var(--rain)}
.op-recent td .who{color:var(--ink)}
.op-recent .bad{color:var(--ember)}
.op-recent td.model{max-width:14rem;overflow:hidden;text-overflow:ellipsis}
.op-more{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-top:.9rem;
  font-family:var(--mono);font-size:.6875rem;color:var(--rain)}
.op-more button{font-family:var(--mono);font-size:.75rem;color:var(--body);cursor:pointer;
  background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:.42rem .9rem}
.op-more button:hover{border-color:var(--flash);color:var(--flash-ink)}
.op-more button[disabled]{opacity:.4;cursor:default}
footer{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:.75rem;color:var(--rain)}
</style>
</head>
<body>
<div class="wrap">
  <div class="op-head">
    <h1>使用紀錄</h1>
    <span class="seg" id="seg">
      <a href="/admin?days=1">今天</a><a href="/admin?days=7">7 天</a><a href="/admin?days=30">30 天</a>
    </span>
    <span class="who">{{USER}} <a href="/admin/logout">登出</a></span>
  </div>

  <div class="op-strip">
    <span class="n" id="total">–</span>
    <div class="sub" id="summary">讀取中…</div>
  </div>

  <h2>每日模型呼叫<span class="hint" id="chartHint"></span></h2>
  <svg class="op-chart" id="chart" viewBox="0 0 700 110" preserveAspectRatio="none" role="img" aria-label="每日呼叫數"></svg>

  <div class="op-cols">
    <section>
      <h2>使用者佔比<span class="hint">點一塊只看他</span></h2>
      <div class="op-pie">
        <svg id="pie" viewBox="0 0 100 100" role="img" aria-label="使用者呼叫佔比"></svg>
        <div class="op-legend" id="legend"></div>
      </div>
    </section>
    <section>
      <h2>各模型<span class="hint">前 10 名 · 點一列只看它</span></h2>
      <div class="op-bar-list" id="models"></div>
    </section>
  </div>

  <h2>呼叫紀錄<span class="hint" id="recentHint"></span></h2>
  <div class="op-filter">
    <label>起（台北時間）<input type="datetime-local" id="fStart"></label>
    <label>迄<input type="datetime-local" id="fEnd"></label>
    <label>使用者<select id="fUid"><option value="">全部</option></select></label>
    <label>模型<select id="fModel"><option value="">全部</option></select></label>
    <label>類型<select id="fKind"><option value="call">模型呼叫</option><option value="poll">任務輪詢</option><option value="meta">頁面載入</option><option value="all">全部</option></select></label>
    <label>狀態<select id="fOk"><option value="">全部</option><option value="1">只看成功</option><option value="0">只看失敗</option></select></label>
    <label class="grow">關鍵字<input type="search" id="fQ" placeholder="端點、使用者…"></label>
    <label class="chk" title="來源 IP 要另外查平台日誌，載入會變慢，所以預設不查"><input type="checkbox" id="fIp">來源 IP</label>
    <button type="button" id="fReset">清除條件</button>
  </div>
  <div class="op-recent">
    <div class="scroll-wrap" role="region" aria-label="呼叫紀錄" tabindex="0">
      <table>
        <thead><tr id="head"><th>時間</th><th>使用者</th><th>模型</th><th>狀態</th></tr></thead>
        <tbody id="recent"><tr><td colspan="4">讀取中…</td></tr></tbody>
      </table>
    </div>
    <div class="op-more">
      <span id="note"></span>
      <button type="button" id="more" disabled>顯示更多</button>
    </div>
  </div>

  <footer>時間一律台北時間 · uid 是金鑰雜湊，不可反推 · 勾「來源 IP」才會去查平台日誌，統計檔本身不存</footer>
</div>

<script>
(async () => {
  const days = {{DAYS}};
  const PAGE = 50;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const num = n => Number(n).toLocaleString('en-US');
  // 統計的 ts 是 UTC（容器沒設 TZ），顯示與查詢一律台北時間
  const fmt = ts => { const d = new Date(new Date(ts + 'Z').getTime() + 8 * 3600e3);
    return isNaN(d) ? ts : d.toISOString().replace('T', ' ').slice(5, 16); };
  // 只用天青一個色相、以明度分階（設計規範不允許第二個彩度）；深→淺對應大→小
  const tint = (i, n) => `hsl(172 18% ${Math.round(34 + (n <= 1 ? 0 : i / (n - 1)) * 42)}%)`;

  let offset = 0, loaded = 0, timer = null;

  const params = extra => {
    const p = new URLSearchParams({ days, limit: PAGE, offset });
    for (const [k, el] of [['start', 'fStart'], ['end', 'fEnd'], ['uid', 'fUid'], ['model', 'fModel'], ['ok', 'fOk'], ['q', 'fQ'], ['kind', 'fKind']]) {
      const v = $(el).value.trim();
      if (v) p.set(k, v);
    }
    if ($('fIp').checked) p.set('ip', '1');
    return p;
  };

  const loadRows = async (append = false) => {
    const withIp = $('fIp').checked;
    $('head').innerHTML = '<th>時間</th><th>使用者</th><th>模型</th><th>狀態</th>' + (withIp ? '<th>來源 IP</th>' : '');
    const cols = withIp ? 5 : 4;
    if (!append) { offset = 0; loaded = 0; $('recent').innerHTML = `<tr><td colspan="${cols}">讀取中…</td></tr>`; }
    const res = await fetch('/admin/api/rows?' + params(), { credentials: 'same-origin' }).then(r => r.json());
    const names = res.model_names || {};
    const html = (res.rows || []).map(r => `<tr>
      <td>${esc(fmt(r.ts))}</td>
      <td class="${r.user ? '' : 'empty'}">${r.user ? `<span class="who">${esc(r.user)}</span>` : ''}</td>
      <td class="model ${r.model ? '' : 'empty'}" title="${esc(r.model || '')}">${r.model ? esc(names[r.model] || r.model) : ''}</td>
      <td class="${r.ok ? '' : 'bad'}" title="${esc(r.endpoint)}">${esc(r.status)}</td>
      ${withIp ? `<td class="${r.ip ? '' : 'empty'}">${esc(r.ip || '')}</td>` : ''}
    </tr>`).join('');
    const tb = $('recent');
    if (append) tb.insertAdjacentHTML('beforeend', html);
    else tb.innerHTML = html || `<tr><td colspan="${cols}">沒有符合條件的紀錄</td></tr>`;
    loaded += (res.rows || []).length;
    offset = loaded;
    $('recentHint').textContent = `${num(loaded)} / ${num(res.total)} 筆`;
    $('more').disabled = loaded >= res.total;
    $('more').textContent = loaded >= res.total ? '已全部顯示' : `顯示更多（剩 ${num(res.total - loaded)}）`;
    $('note').textContent = withIp ? '來源 IP 取自平台日誌（保留 30 天），統計檔本身不存' : '狀態欄滑過去看端點';
  };

  const rerun = () => { clearTimeout(timer); timer = setTimeout(() => loadRows(false), 250); };
  ['fStart', 'fEnd', 'fUid', 'fModel', 'fOk', 'fIp', 'fKind'].forEach(id => $(id).addEventListener('change', rerun));
  $('fQ').addEventListener('input', rerun);
  $('more').addEventListener('click', () => loadRows(true));
  $('fReset').addEventListener('click', () => {
    ['fStart', 'fEnd', 'fUid', 'fModel', 'fOk', 'fQ'].forEach(id => { $(id).value = ''; });
    $('fKind').value = 'call';
    document.querySelectorAll('.sel').forEach(e => e.classList.remove('sel'));
    loadRows(false);
  });

  // 點柱子＝把查詢區間設成那一天；再點一次取消
  const pickDay = (day, el) => {
    const on = el.classList.contains('sel');
    document.querySelectorAll('.op-chart rect.sel').forEach(e => e.classList.remove('sel'));
    $('fStart').value = on ? '' : `${day}T00:00`;
    $('fEnd').value = on ? '' : `${day}T23:59`;
    if (!on) el.classList.add('sel');
    loadRows(false);
  };

  const drawChart = (perDay) => {
    const items = Object.entries(perDay);
    if (!items.length) { $('chartHint').textContent = '沒有資料'; return; }
    const max = Math.max(...items.map(d => d[1]));
    // 柱寬設上限：7 天檢視若平分 700，每根近百單位寬會像色塊；超過就用間距補滿
    const n = items.length;
    const w = Math.min(28, Math.max(1, (700 - 3 * (n - 1)) / n));
    const gap = n > 1 ? (700 - w * n) / (n - 1) : 0;
    $('chart').innerHTML = items.map(([d, v], i) => {
      const h = Math.max(v > 0 ? 1.5 : 0, v / max * 90);
      return `<rect data-day="${d}" x="${(i * (w + gap)).toFixed(2)}" y="${(90 - h).toFixed(2)}" width="${w.toFixed(2)}" height="${h.toFixed(2)}"><title>${esc(d.slice(5))}：${v} 次</title></rect>`;
    }).join('') +
      `<text class="axis-label" x="0" y="104">${esc(items[0][0].slice(5))}</text>` +
      `<text class="axis-label" x="700" y="104" text-anchor="end">${esc(items[n - 1][0].slice(5))}</text>`;
    $('chart').querySelectorAll('rect').forEach(el => el.addEventListener('click', () => pickDay(el.dataset.day, el)));
    $('chartHint').textContent = `尖峰 ${max} 次／日 · 點一根柱子看那天`;
  };

  // 圓環：前 8 名各一塊，其餘併成「其他」。用 path 畫扇形，不靠任何圖表庫。
  const drawPie = (users, total) => {
    const TOP = 8;
    const head = users.slice(0, TOP);
    const tail = users.slice(TOP);
    const parts = head.map(u => ({ id: u.id, name: u.name || u.id, calls: u.calls }));
    if (tail.length) parts.push({ id: '', name: `其他 ${tail.length} 位`, calls: tail.reduce((a, u) => a + u.calls, 0) });
    const sum = parts.reduce((a, p) => a + p.calls, 0) || 1;
    const R = 42, r = 26, cx = 50, cy = 50;
    let a0 = -Math.PI / 2;
    const arcs = parts.map((p, i) => {
      const a1 = a0 + p.calls / sum * Math.PI * 2;
      const big = a1 - a0 > Math.PI ? 1 : 0;
      const pt = (ang, rad) => `${(cx + rad * Math.cos(ang)).toFixed(2)} ${(cy + rad * Math.sin(ang)).toFixed(2)}`;
      const d = `M ${pt(a0, R)} A ${R} ${R} 0 ${big} 1 ${pt(a1, R)} L ${pt(a1, r)} A ${r} ${r} 0 ${big} 0 ${pt(a0, r)} Z`;
      a0 = a1;
      return `<path d="${d}" fill="${tint(i, parts.length)}" data-id="${esc(p.id)}"><title>${esc(p.name)}：${p.calls} 次（${(p.calls / sum * 100).toFixed(1)}%）</title></path>`;
    }).join('');
    $('pie').innerHTML = arcs +
      `<text class="mid" x="50" y="48"><tspan class="big">${users.length}</tspan></text>` +
      `<text class="mid" x="50" y="60">位使用者</text>`;
    $('legend').innerHTML = parts.map((p, i) => `<div class="row" data-id="${esc(p.id)}">
      <span class="dot" style="background:${tint(i, parts.length)}"></span>
      <span class="nm" title="${esc(p.name)}">${esc(p.name)}</span>
      <span class="pc">${(p.calls / sum * 100).toFixed(1)}%</span>
      <span class="ct">${num(p.calls)}</span>
    </div>`).join('');
    // 圓環與圖例都能點來篩選；「其他」沒有單一 uid，不做篩選
    const pick = (id, el, group) => {
      if (!id) return;
      const on = el.classList.contains('sel');
      document.querySelectorAll('.op-legend .row.sel').forEach(e => e.classList.remove('sel'));
      if (!on) group.forEach(e => { if (e.dataset.id === id && e.classList.contains('row')) e.classList.add('sel'); });
      $('fUid').value = on ? '' : id;
      loadRows(false);
    };
    const rows = [...$('legend').querySelectorAll('.row')];
    rows.forEach(el => el.addEventListener('click', () => pick(el.dataset.id, el, rows)));
    $('pie').querySelectorAll('path').forEach(el => el.addEventListener('click', () => {
      const row = rows.find(r => r.dataset.id === el.dataset.id);
      if (row) pick(el.dataset.id, row, rows);
    }));
  };

  const barList = (el, items, filterId) => {
    const top = Math.max(1, ...items.map(i => i.calls));
    el.innerHTML = items.map(it => {
      const w = it.calls / top * 100;                       // 條長＝相對呼叫量
      const okPct = it.calls ? it.ok / it.calls * 100 : 0;  // 條內比例＝成功／失敗
      const fails = Object.entries(it.statuses || {});
      return `<div class="op-bar-row" data-id="${esc(it.id)}">
        <span class="name">${esc(it.name || it.id)}</span>
        <span class="count">${num(it.calls)}</span>
        <span class="op-bar-track"><span class="fill-bar" style="width:${w.toFixed(1)}%"><span class="fill-ok" style="width:${okPct.toFixed(1)}%"></span><span class="fill-err" style="width:${(100 - okPct).toFixed(1)}%"></span></span></span>
        ${fails.length ? `<span class="fail">${fails.map(([c, k]) => `${c}×${k}`).join(' · ')}</span>` : ''}
      </div>`;
    }).join('') || '<div class="op-more">沒有資料</div>';
    el.querySelectorAll('.op-bar-row').forEach(row => row.addEventListener('click', () => {
      const on = row.classList.contains('sel');
      el.querySelectorAll('.op-bar-row.sel').forEach(e => e.classList.remove('sel'));
      if (!on) row.classList.add('sel');
      $(filterId).value = on ? '' : row.dataset.id;
      loadRows(false);
    }));
  };

  try {
    document.querySelectorAll('#seg a').forEach(a => { if (a.getAttribute('href').endsWith('days=' + days)) a.classList.add('on'); });
    const stats = await fetch(`/admin/api/stats?days=${days}`, { credentials: 'same-origin' }).then(r => r.json());
    const okPct = stats.total ? (stats.ok / stats.total * 100) : 0;
    $('total').innerHTML = `${num(stats.total)}<small>次模型呼叫</small>`;
    // 輪詢與頁面載入不計進佔比（一支影片會輪詢數十次），但也不隱藏，列在後面
    $('summary').innerHTML = `<b>${stats.users.length}</b> 位使用者 · <b>${stats.models.length}</b> 個模型 · 成功率 <b>${okPct.toFixed(1)}%</b>`
      + ` · 另有任務輪詢 <b>${num(stats.polls)}</b> 次、頁面載入 <b>${num(stats.meta)}</b> 次`;
    drawChart(stats.per_day);
    drawPie(stats.users, stats.total);
    const TOP_M = 10;
    barList($('models'), stats.models.slice(0, TOP_M), 'fModel');
    if (stats.models.length > TOP_M) {
      const rest = stats.models.slice(TOP_M).reduce((a, m) => a + m.calls, 0);
      $('models').insertAdjacentHTML('beforeend',
        `<div class="op-more">還有 ${stats.models.length - TOP_M} 個模型，合計 ${num(rest)} 次 · 用下面的「模型」下拉查</div>`);
    }
    // 下拉的選項就是上面兩塊的內容，永遠一致
    $('fModel').innerHTML = '<option value="">全部</option>' + stats.models.map(m => `<option value="${esc(m.id)}">${esc(m.name || m.id)}</option>`).join('');
    $('fUid').innerHTML = '<option value="">全部</option>' + stats.users.map(u => `<option value="${esc(u.id)}">${esc(u.name || u.id)}</option>`).join('');
    await loadRows(false);
  } catch (e) {
    $('summary').innerHTML = `<b style="color:var(--ember)">讀取失敗</b> ${esc(e.message)}`;
  }
})();
</script>
</body>
</html>
