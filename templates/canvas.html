<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Canvas — NenAI Testing Platform</title>
    <meta name="robots" content="noai, noimageai">
    <link rel="icon" type="image/png" href="/static/img/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/css/litegraph.css">
    <link rel="stylesheet" href="/static/css/canvas.css?v=11">
</head>
<body>

<div id="canvasLoginGate" class="canvas-login-gate" style="display:none">
    <p>請先登入才能使用 AI Canvas</p>
    <a href="/">回登入頁</a>
</div>

<div id="canvasApp" style="display:none">
    <header class="canvas-topbar">
        <a href="/" class="canvas-back-btn" title="返回">‹</a>
        <span class="canvas-breadcrumb">Canvas</span>
        <span class="canvas-breadcrumb-sep">/</span>
        <input id="canvasTitle" class="canvas-title-input" value="Untitled Canvas">
        <div class="canvas-topbar-right">
            <span id="canvasSaveStatus" style="color:var(--cv-text-sub);font-size:0.78rem"></span>
            <input type="file" id="canvasImportInput" accept="application/json" style="display:none">
            <button class="canvas-btn-ghost" id="btnImportCanvas">匯入</button>
            <button class="canvas-btn-ghost" id="btnExportCanvas">匯出</button>
            <button class="canvas-btn-ghost" id="btnClearCanvas">清空畫布</button>
            <button class="canvas-btn-ghost" onclick="location.href='/'">返回主控台</button>
        </div>
    </header>

    <div class="canvas-toolbar">
        <button class="canvas-tool-btn" id="btnAddNode" title="新增節點">+</button>
        <button class="canvas-tool-btn" id="btnTemplates" title="套用範本">▤</button>
        <button class="canvas-tool-btn" id="btnRunAll" title="依順序執行整張圖">▶</button>
        <button class="canvas-tool-btn" id="btnFitView" title="置中顯示全部節點">⤢</button>
    </div>

    <div id="addNodeMenu" class="add-node-menu" style="display:none">
        <div class="add-node-menu-title">新增節點</div>
        <button data-type="text">文字 Text</button>
        <button data-type="camera_angle">相機角度 Camera Angle</button>
        <button data-type="load_image">上傳圖片 Load Image</button>
        <button data-type="image">圖片 Image</button>
        <button data-type="video">影片 Video</button>
        <button data-type="video_edit">影片編輯 Video Edit</button>
        <button data-type="video_animate">動作動畫 Animate</button>
        <button data-type="audio">語音 TTS</button>
        <button data-type="edit">圖像編輯 Editing</button>
        <button data-type="muleai">MuleAI Spicy</button>
    </div>

    <div id="templatesMenu" class="add-node-menu" style="display:none">
        <div class="add-node-menu-title">套用範本</div>
        <!-- 按鈕由 JS 依 CANVAS_TEMPLATES 動態產生，data-template-id 對應範本 id -->
    </div>

    <div class="canvas-zoom-controls">
        <button id="zoomOut">−</button>
        <span id="zoomLabel">100%</span>
        <button id="zoomIn">+</button>
        <button id="zoomReset" title="重置縮放">重置</button>
    </div>

    <canvas id="litegraphCanvas"></canvas>

    <div id="cvLightbox" class="cv-lightbox" style="display:none">
        <button class="cv-lightbox-close" title="關閉">✕</button>
        <div class="cv-lightbox-body"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/build/litegraph.min.js"></script>
<script src="/static/js/canvas.js?v=33"></script>
</body>
</html>
