services:
  ai-model-tester:
    build: .
    ports:
      - "5050:5050"
    volumes:
      - ./outputs:/app/outputs
      - ./static/uploads:/app/static/uploads
    environment:
      - PYTHONUNBUFFERED=1
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
    restart: unless-stopped
